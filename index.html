<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melvor Signet B Calc</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Melvor Idle Color Palette */
            --bg-dark: #060e14;
            --panel-bg: #1b262d;
            --border-color: #3e4d59;
            --text-main: #cbd5e0;
            --text-header: #ffffff;
            --accent-gold: #e2ae5b;
            --accent-green: #5cb85c;
            --input-bg: #0f171d;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            margin: 0;
        }

        .calc-container {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .header {
            background-color: rgba(0,0,0,0.2);
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            text-align: center;
        }

        h2 {
            color: var(--accent-gold);
            margin: 0;
            font-size: 1.25rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .requirement-banner {
            background: rgba(226, 174, 91, 0.1);
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            font-size: 0.8rem;
            margin: 15px 20px;
            padding: 8px;
            text-align: center;
            border-radius: 2px;
        }

        .content {
            padding: 20px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--text-header);
        }

        input {
            width: 100%;
            padding: 12px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: #fff;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-gold);
        }

        .results-section {
            background-color: rgba(0,0,0,0.3);
            border-radius: 4px;
            padding: 20px;
            margin-top: 10px;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .result-item span:last-child {
            color: var(--accent-green);
            font-weight: 700;
        }

        .formula-footer {
            font-size: 0.7rem;
            color: #718096;
            text-align: center;
            padding: 15px;
            border-top: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

<div class="calc-container">
    <div class="header">
        <h2>Signet Half (b) Calc</h2>
    </div>
    
    <div class="requirement-banner">
        Requires Gold Topaz Ring & Normal Damage
    </div>

    <div class="content">
        <div class="input-group">
            <label>Monster Combat Level</label>
            <input type="number" id="lvl" placeholder="e.g. 150" oninput="calculate()">
        </div>
        <div class="input-group">
            <label>Kills Per Hour</label>
            <input type="number" id="kph" placeholder="e.g. 600" oninput="calculate()">
        </div>
        <div class="input-group">
            <label>Hours to Farm</label>
            <input type="number" id="hours" placeholder="e.g. 12" oninput="calculate()">
        </div>

        <div class="results-section">
            <div class="result-item">
                <span>Chance per kill:</span>
                <span id="res-chance">0%</span>
            </div>
            <div class="result-item">
                <span>Total kills:</span>
                <span id="res-total">0</span>
            </div>
            <div class="result-item">
                <span>Success Probability:</span>
                <span id="res-prob">0%</span>
            </div>
        </div>
    </div>

    <div class="formula-footer">
        Formula: 1 - (1 - (Lvl / 1,000,000))^TotalKills
    </div>
</div>

<script>
    function calculate() {
        const lvl = parseFloat(document.getElementById('lvl').value) || 0;
        const kph = parseFloat(document.getElementById('kph').value) || 0;
        const hours = parseFloat(document.getElementById('hours').value) || 0;

        const totalKills = kph * hours;
        const chancePerKill = lvl / 1000000;
        const successProb = 1 - Math.pow((1 - chancePerKill), totalKills);

        document.getElementById('res-chance').innerText = (chancePerKill * 100).toFixed(4) + '%';
        document.getElementById('res-total').innerText = totalKills.toLocaleString();
        document.getElementById('res-prob').innerText = (successProb * 100).toFixed(2) + '%';
    }
</script>

</body>
</html>
