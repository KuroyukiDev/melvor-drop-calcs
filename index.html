<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melvor Signet B Calc</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIk1lbHZvciBTaWduZXQgQ2FsYyIsCiAgInNob3J0X25hbWUiOiAiU2lnbmV0Q2FsYyIsCiAgInN0YXJ0X3VybCI6ICIuIiwKICAiZGlzcGxheSI6ICJzdGFuZGFsb25lIiwKICAiYmFja2dyb3VuZF9jb2xvciI6ICIjMjEyNTI5IiwKICAidGhlbWVfY29sb3IiOiAiIzBkNmVmZCIKfQ==">
    <style>
        body { background-color: #1a1a1a; color: #e0e0e0; min-height: 100vh; display: flex; align-items: center; }
        .card { background-color: #2d2d2d; border: 1px solid #444; }
        .form-control { background-color: #3d3d3d; border: 1px solid #555; color: white; }
        .form-control:focus { background-color: #444; color: white; border-color: #0d6efd; box-shadow: none; }
        .result-box { background-color: #1e1e1e; border-radius: 8px; padding: 15px; border-left: 4px solid #0d6efd; }
    </style>
</head>
<body>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-lg">
                <div class="card-body p-4">
                    <h3 class="text-center mb-4 text-primary">Signet Half (b) Calc</h3>
                    <p class="text-muted small text-center">Requires Gold Topaz Ring & Normal Damage</p>
                    
                    <div class="mb-3">
                        <label class="form-label">Monster Combat Level</label>
                        <input type="number" id="monsterLvl" class="form-control" value="100">
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Kills Per Hour</label>
                        <input type="number" id="killsHr" class="form-control" value="500">
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Hours to Farm</label>
                        <input type="number" id="hours" class="form-control" step="0.5" value="12">
                    </div>

                    <button onclick="calculate()" class="btn btn-primary w-100 mb-4">Calculate Drop Chance</button>

                    <div id="results" class="result-box d-none">
                        <div class="mb-2 text-info fw-bold">Results:</div>
                        <div class="small">Chance per kill: <span id="perKill" class="text-white"></span></div>
                        <div class="small">Total kills: <span id="totalKills" class="text-white"></span></div>
                        <hr class="my-2 border-secondary">
                        <div class="h5">Success Probability: <span id="prob" class="text-success"></span></div>
                        <div class="text-muted x-small mt-2" style="font-size: 0.75rem;">
                            Formula: 1 - (1 - (Lvl / 1,000,000))^TotalKills
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    function calculate() {
        const lvl = parseFloat(document.getElementById('monsterLvl').value);
        const kph = parseFloat(document.getElementById('killsHr').value);
        const hrs = parseFloat(document.getElementById('hours').value);
        
        // Base Game Formula
        const chancePerKill = lvl / 1000000;
        const totalKills = kph * hrs;
        
        // Cumulative probability (1 - chance of failing every time)
        const probSuccess = (1 - Math.pow((1 - chancePerKill), totalKills)) * 100;

        document.getElementById('perKill').innerText = (chancePerKill * 100).toFixed(6) + '%';
        document.getElementById('totalKills').innerText = totalKills.toLocaleString();
        document.getElementById('prob').innerText = probSuccess.toFixed(2) + '%';
        document.getElementById('results').classList.remove('d-none');
    }

    // Register simple Service Worker for PWA compliance
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').catch(() => {
                console.log('SW registration failed (Standard for local file preview)');
            });
        });
    }
</script>

</body>
</html>
